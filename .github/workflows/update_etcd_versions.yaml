name: update_etcd_versions

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update_etcd_versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Update version file
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cd assets
          python -m pip install requests packaging
          python get_all_etcd_versions.py

      - name: Push updated version file
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          if [[ -n $(git status --short) ]]; then
            git add assets
            git commit -m "chore(versions.txt): update etcd version file"
            git push "https://github-actions[bot]:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          else
            echo "etcd versions are unchanged"
          fi
