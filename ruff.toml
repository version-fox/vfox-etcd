# Python checks for the scripts under assets/, website/ and .github/scripts/.
# The width matches stylua.toml, so the two formatters agree on the house style.
line-length = 120
target-version = "py310"

[lint]
select = ["E4", "E7", "E9", "F", "B", "I"]
